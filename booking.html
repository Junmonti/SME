<section class="booking-section" id="booking">

    <div class="booking-container">

        <h2>Book A Free Consultation</h2>

        <div class="calendar-header">

            <button id="prevMonth">
                ❮
            </button>

            <h3 id="monthYear"></h3>

            <button id="nextMonth">
                ❯
            </button>

        </div>

        <div class="calendar-days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="calendar" class="calendar-grid"></div>

        <div class="booking-form">

            <h3>Appointment Details</h3>

            <p id="selectedDate">
                Please select a date.
            </p>

            <select id="timeSlot">
                <option value="">
                    Select Time
                </option>
            </select>

            <input
                type="text"
                id="clientName"
                placeholder="Full Name"
            >

            <input
                type="email"
                id="clientEmail"
                placeholder="Email Address"
            >

            <button id="bookBtn">
                Book Consultation
            </button>

        </div>

    </div>

</section>
